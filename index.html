<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!---divs são nomes arbitrários, portanto podem receber o nome do que elas significam como <main></main>
    <div id="main"></div> == <main></main>--->
    <header>
        <h1>Calculadora fodástica</h1>
    </header>
    <main>
        <p>Conteúdo</p>
        <input type="text" id="display" placeholder="0" readonly>
        
        <div id="teclado">
            <button id="btn7">7</button>
            <button id="btn8">8</button>
            <button id="btn9">9</button>
            <button id="btnSomar">+</button>
            
            <button id="btn4">4</button>
            <button id="btn5">5</button>
            <button id="btn6">6</button>
            <button id="btnMenos">-</button>
        
            <button id="btn1">1</button>
            <button id="btn2">2</button>
            <button id="btn3">3</button>
            <button id="btnMult">*</button>
            
            <button id="btn0">0</button>
            <button id="btnC">C</button>
            <button id="btnIgual">=</button>
            <button id="btnDiv">/</button>
        </div>



    </main>
    <script src="script.js"></script>
</body>
</html>
